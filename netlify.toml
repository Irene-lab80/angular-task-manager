[build]
  # Repo root. Overrides the base directory set in the UI, which points at the build output folder
  base = "."
  # Install dependencies first when they are not already present
  command = "(test -d node_modules/@angular/cli || npm ci) && npm run build"
  publish = "dist/angular-app/browser"

# Serve index.html for client-side routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
