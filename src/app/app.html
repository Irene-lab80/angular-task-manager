<app-header></app-header>

<main id="top">
  <nav class="nav">
    <app-button
      [variant]="currentPage === 'home' ? 'navigation-active' : 'navigation'"
      [disabled]="currentPage === 'home'"
      (click)="currentPage = 'home'"
    >
      Главная
    </app-button>
    <app-button
      [variant]="currentPage === 'tasks' ? 'navigation-active' : 'navigation'"
      [disabled]="currentPage === 'tasks'"
      (click)="currentPage = 'tasks'"
    >
      Задачи
    </app-button>
    <app-button
      [variant]="currentPage === 'create' ? 'navigation-active' : 'navigation'"
      [disabled]="currentPage === 'create'"
      (click)="currentPage = 'create'"
    >
      Создать
    </app-button>
  </nav>
  @switch (currentPage) {
    @case ('home') {
      <app-home />
    }
    @case ('tasks') {
      <app-tasks />
    }
    @case ('create') {
      <app-create />
    }
  }
</main>

<app-footer></app-footer>
