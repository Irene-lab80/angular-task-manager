<app-header></app-header>

<main id="top">
  <nav class="nav">
    <button
      class="nav-button"
      [class.active]="currentPage === 'home'"
      [disabled]="currentPage === 'home'"
      (click)="currentPage = 'home'"
    >
      Главная
    </button>
    <button
      class="nav-button"
      [class.active]="currentPage === 'tasks'"
      [disabled]="currentPage === 'tasks'"
      (click)="currentPage = 'tasks'"
    >
      Задачи
    </button>
    <button
      class="nav-button"
      [class.active]="currentPage === 'create'"
      [disabled]="currentPage === 'create'"
      (click)="currentPage = 'create'"
    >
      Создать
    </button>
  </nav>
  @switch (currentPage) {
    @case ('home') {
      <app-home />
    }
    @case ('tasks') {
      <app-tasks />
    }
    @case ('create') {
      <app-create />
    }
  }
</main>

<app-footer></app-footer>
